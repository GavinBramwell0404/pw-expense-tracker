<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PW Expense Tracker</title>

  <style>

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {

      margin: 0;

      font-family: Arial, Helvetica, sans-serif;

      background: #eef2f7;

      color: #111827;

    }

    .phone-shell {

      max-width: 430px;

      margin: 0 auto;

      min-height: 100vh;

      background: #f8fafc;

      box-shadow: 0 0 0 1px rgba(0,0,0,.04);

    }

    .topbar {

      position: sticky;

      top: 0;

      z-index: 20;

      background: rgba(248,250,252,.92);

      backdrop-filter: blur(10px);

      border-bottom: 1px solid #e5e7eb;

      padding: 14px 16px 12px;

    }

    h1, h2, h3, p { margin: 0; }

    h1 { font-size: 24px; }

    h2 { font-size: 18px; }

    .muted { color: #6b7280; }

    .content {

      padding: 14px;

      display: grid;

      gap: 14px;

    }

    .card {

      background: white;

      border-radius: 18px;

      border: 1px solid #e5e7eb;

      box-shadow: 0 6px 18px rgba(0,0,0,.05);

      overflow: hidden;

    }

    .card-body { padding: 16px; }

    .stack { display: grid; gap: 12px; }

    label {

      display: block;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 6px;

      color: #374151;

    }

    input, select, textarea, button {

      font: inherit;

    }

    input, select, textarea {

      width: 100%;

      padding: 13px 14px;

      border: 1px solid #d1d5db;

      border-radius: 14px;

      background: white;

      min-height: 48px;

      font-size: 16px;

    }

    textarea {

      min-height: 96px;

      resize: vertical;

    }

    .row-2 {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

    }

    .btn-row {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 12px;

    }

    button {

      border: 0;

      border-radius: 14px;

      padding: 13px 16px;

      cursor: pointer;

      font-weight: 700;

      min-height: 48px;

      touch-action: manipulation;

      font-size: 15px;

    }

    .btn-primary {

      background: #111827;

      color: white;

      width: 100%;

    }

    .btn-secondary {

      background: #dbeafe;

      color: #1e3a8a;

    }

    .btn-outline {

      background: white;

      color: #111827;

      border: 1px solid #d1d5db;

    }

    .hero {

      display: grid;

      gap: 4px;

    }

    .hero-sub {

      font-size: 14px;

    }

    .total-pill {

      margin-top: 12px;

      display: inline-block;

      background: #111827;

      color: white;

      border-radius: 999px;

      padding: 10px 14px;

      font-weight: 700;

      font-size: 15px;

    }

    .summary-boxes {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 12px;

    }

    .mini {

      border: 1px solid #e5e7eb;

      border-radius: 14px;

      padding: 12px;

      background: #f9fafb;

    }

    .filters {

      display: grid;

      gap: 10px;

    }

    .section-head {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      margin-bottom: 12px;

    }

    .expense-list {

      display: grid;

      gap: 10px;

    }

    .expense-item {

      padding: 14px;

      border: 1px solid #eceff3;

      border-radius: 16px;

      background: #fff;

      display: grid;

      gap: 10px;

    }

    .expense-top {

      display: flex;

      justify-content: space-between;

      gap: 10px;

      align-items: start;

    }

    .expense-title {

      font-weight: 700;

      font-size: 15px;

      word-break: break-word;

    }

    .expense-price {

      font-weight: 800;

      white-space: nowrap;

    }

    .expense-meta {

      font-size: 13px;

      color: #6b7280;

      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      line-height: 1.4;

    }

    .delete-btn {

      background: #fee2e2;

      color: #991b1b;

      width: 100%;

    }

    .empty {

      padding: 18px;

      text-align: center;

      color: #6b7280;

      border: 1px dashed #d1d5db;

      border-radius: 14px;

      background: #fff;

    }

    .foot {

      padding: 2px 2px 18px;

      font-size: 12px;

      color: #6b7280;

      text-align: center;

    }

    @media (max-width: 360px) {

      .row-2, .btn-row, .summary-boxes {

        grid-template-columns: 1fr;

      }

      h1 { font-size: 22px; }

    }

  </style>

</head>

<body>

  <div class="phone-shell">

    <div class="topbar">

      <div class="hero">

        <h1>Expense Tracker</h1>

        <p class="muted hero-sub">Simple phone-friendly tracker for your pressure washing business</p>

        <div class="total-pill">Total: <span id="totalBox">$0.00</span></div>

      </div>

      <div class="btn-row">

        <button class="btn-secondary" id="exportBtn">Export CSV</button>

        <button class="btn-outline" id="clearBtn">Clear All</button>

      </div>

    </div>



    <div class="content">

      <div class="card">

        <div class="card-body">

          <div class="section-head">

            <h2>Add Expense</h2>

          </div>

          <form id="expenseForm" class="stack">

            <div>

              <label for="date">Date</label>

              <input type="date" id="date" required />

            </div>



            <div>

              <label for="vendor">What did you buy?</label>

              <input type="text" id="vendor" placeholder="Gas station, Facebook Ads, Home Depot" required />

            </div>



            <div class="row-2">

              <div>

                <label for="category">Category</label>

                <select id="category">

                  <option>Gas</option>

                  <option>Chemicals</option>

                  <option>Equipment</option>

                  <option>Repairs</option>

                  <option>Marketing</option>

                  <option>Insurance</option>

                  <option>Meals</option>

                  <option>Other</option>

                </select>

              </div>

              <div>

                <label for="amount">Amount</label>

                <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required />

              </div>

            </div>



            <div>

              <label for="notes">Notes</label>

              <textarea id="notes" placeholder="Job address, receipt info, or reason"></textarea>

            </div>



            <button type="submit" class="btn-primary">Add Expense</button>

          </form>

        </div>

      </div>



      <div class="card">

        <div class="card-body">

          <div class="section-head">

            <h2>Summary</h2>

          </div>

          <div class="summary-boxes" id="summaryBoxes"></div>

        </div>

      </div>



      <div class="card">

        <div class="card-body">

          <div class="section-head">

            <h2>Filters</h2>

          </div>

          <div class="filters">

            <div>

              <label for="monthFilter">Month</label>

              <select id="monthFilter">

                <option value="all">All</option>

              </select>

            </div>

            <div>

              <label for="categoryFilter">Category</label>

              <select id="categoryFilter">

                <option value="all">All</option>

                <option>Gas</option>

                <option>Chemicals</option>

                <option>Equipment</option>

                <option>Repairs</option>

                <option>Marketing</option>

                <option>Insurance</option>

                <option>Meals</option>

                <option>Other</option>

              </select>

            </div>

            <div>

              <label for="search">Search</label>

              <input type="text" id="search" placeholder="Gas, ads, Home Depot" />

            </div>

          </div>

        </div>

      </div>



      <div class="card">

        <div class="card-body">

          <div class="section-head">

            <div>

              <h2>Expenses</h2>

              <p class="muted"><span id="countBox">0</span> items</p>

            </div>

          </div>

          <div class="expense-list" id="expenseList"></div>

        </div>

      </div>



      <div class="foot">Saved in your browser on this device.</div>

    </div>

  </div>



  <script>

    const LS_KEY = "pw_expenses_v1";

    const dateEl = document.getElementById("date");

    const vendorEl = document.getElementById("vendor");

    const categoryEl = document.getElementById("category");

    const amountEl = document.getElementById("amount");

    const notesEl = document.getElementById("notes");

    const formEl = document.getElementById("expenseForm");

    const monthFilterEl = document.getElementById("monthFilter");

    const categoryFilterEl = document.getElementById("categoryFilter");

    const searchEl = document.getElementById("search");

    const totalBoxEl = document.getElementById("totalBox");

    const summaryBoxesEl = document.getElementById("summaryBoxes");

    const expenseListEl = document.getElementById("expenseList");

    const countBoxEl = document.getElementById("countBox");

    const exportBtn = document.getElementById("exportBtn");

    const clearBtn = document.getElementById("clearBtn");



    let items = JSON.parse(localStorage.getItem(LS_KEY) || "[]");



    function todayISO() {

      return new Date().toISOString().slice(0, 10);

    }



    function fmtUSD(n) {

      return Number(n || 0).toLocaleString(undefined, { style: "currency", currency: "USD" });

    }



    function monthKey(date) {

      return (date || "").slice(0, 7);

    }



    function save() {

      localStorage.setItem(LS_KEY, JSON.stringify(items));

    }



    function getFiltered() {

      const month = monthFilterEl.value;

      const cat = categoryFilterEl.value;

      const q = searchEl.value.trim().toLowerCase();



      return items

        .filter(i => month === "all" || monthKey(i.date) === month)

        .filter(i => cat === "all" || i.category === cat)

        .filter(i => {

          if (!q) return true;

          return `${i.vendor} ${i.category} ${i.notes} ${i.date}`.toLowerCase().includes(q);

        })

        .sort((a, b) => b.date.localeCompare(a.date));

    }



    function refreshMonths() {

      const current = monthFilterEl.value;

      const months = [...new Set(items.map(i => monthKey(i.date)).filter(Boolean))].sort().reverse();

      monthFilterEl.innerHTML = '<option value="all">All</option>';

      months.forEach(m => {

        const opt = document.createElement("option");

        opt.value = m;

        opt.textContent = m;

        monthFilterEl.appendChild(opt);

      });

      monthFilterEl.value = months.includes(current) ? current : "all";

    }



    function render() {

      refreshMonths();

      const filtered = getFiltered();

      const total = filtered.reduce((sum, i) => sum + Number(i.amount || 0), 0);

      totalBoxEl.textContent = fmtUSD(total);

      countBoxEl.textContent = filtered.length;



      const byCat = {};

      filtered.forEach(i => {

        byCat[i.category] = (byCat[i.category] || 0) + Number(i.amount || 0);

      });



      summaryBoxesEl.innerHTML = "";

      const topCats = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]).slice(0, 6);

      if (topCats.length === 0) {

        summaryBoxesEl.innerHTML = '<div class="mini muted">No expenses yet.</div>';

      } else {

        topCats.forEach(cat => {

          const div = document.createElement("div");

          div.className = "mini";

          div.innerHTML = `<strong>${cat}</strong><div class="muted">${fmtUSD(byCat[cat])}</div>`;

          summaryBoxesEl.appendChild(div);

        });

      }



      expenseListEl.innerHTML = "";

      if (filtered.length === 0) {

        expenseListEl.innerHTML = '<div class="empty">No matching expenses.</div>';

        return;

      }



      filtered.forEach(item => {

        const row = document.createElement("div");

        row.className = "expense-item";

        row.innerHTML = `

          <div class="expense-main">

            <div class="expense-top">

              <div class="expense-title">${escapeHtml(item.vendor)}</div>

              <div><strong>${fmtUSD(item.amount)}</strong></div>

            </div>

            <div class="expense-meta">

              <span>${escapeHtml(item.date)}</span>

              <span>•</span>

              <span>${escapeHtml(item.category)}</span>

              ${item.notes ? `<span>•</span><span>${escapeHtml(item.notes)}</span>` : ""}

            </div>

          </div>

          <button class="delete-btn" data-id="${item.id}">Delete</button>

        `;

        expenseListEl.appendChild(row);

      });

    }



    function escapeHtml(str) {

      return String(str || "")

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

    }



    function exportCSV() {

      const filtered = getFiltered();

      const rows = [

        ["Date", "Vendor", "Category", "Amount", "Notes"],

        ...filtered.map(i => [i.date, i.vendor, i.category, i.amount, i.notes || ""])

      ];

      const csv = rows.map(r => r.map(v => {

        const s = String(v ?? "");

        return /[\n\r,"]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;

      }).join(",")).join("\n");



      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });

      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");

      a.href = url;

      a.download = "expenses.csv";

      a.click();

      URL.revokeObjectURL(url);

    }



    formEl.addEventListener("submit", function (e) {

      e.preventDefault();

      const date = dateEl.value;

      const vendor = vendorEl.value.trim();

      const category = categoryEl.value;

      const amount = Number(amountEl.value);

      const notes = notesEl.value.trim();



      if (!date || !vendor || !Number.isFinite(amount) || amount <= 0) return;



      items.unshift({

        id: String(Date.now() + Math.random()),

        date,

        vendor,

        category,

        amount: Math.round(amount * 100) / 100,

        notes

      });



      save();

      vendorEl.value = "";

      amountEl.value = "";

      notesEl.value = "";

      render();

    });



    expenseListEl.addEventListener("click", function (e) {

      if (!e.target.matches(".delete-btn")) return;

      const id = e.target.getAttribute("data-id");

      items = items.filter(i => i.id !== id);

      save();

      render();

    });



    [monthFilterEl, categoryFilterEl, searchEl].forEach(el => {

      el.addEventListener("input", render);

      el.addEventListener("change", render);

    });



    exportBtn.addEventListener("click", exportCSV);

    clearBtn.addEventListener("click", function () {

      if (!confirm("Clear all saved expenses?")) return;

      items = [];

      save();

      render();

    });



    dateEl.value = todayISO();

    render();

  </script>

</body>

</html>
